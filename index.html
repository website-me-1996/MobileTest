<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real Performance Index</title>
<style>
:root{--bg:#07080f;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#eef1ff;--mu:#8d93b3;--a:#7c5cff;--b:#22d3ee;--ok:#34d399;--wn:#fbbf24;--bad:#fb7185;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(800px 500px at 0% -5%,#3b21a366,transparent),radial-gradient(700px 500px at 100% 15%,#0e749055,transparent),var(--bg);background-attachment:fixed;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 10px}
.mu{color:var(--mu)}.sm{font-size:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:#ffffff0a;border-radius:12px;padding:8px 10px;min-width:0}.k b{display:block;font-size:11px;color:var(--mu);font-weight:600}.k span{font-size:13px;word-break:break-word}.k.wide{grid-column:1/-1}.k.wide span{font-size:11px}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 8px 30px #7c5cff55;margin-top:12px}.btn:disabled{opacity:.5}
select{background:#ffffff14;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;margin-left:6px}
.row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.gw{position:relative;width:110px;height:110px;flex:none}.gw svg{width:100%;height:100%}.gw b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.gt{fill:none;stroke:var(--bd);stroke-width:9}.gf{fill:none;stroke:var(--b);stroke-width:9;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .6s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ch{font-size:11px;padding:3px 9px;border-radius:99px;background:#ffffff10;color:var(--mu)}.ch.a{background:var(--a);color:#fff}.ch.d{background:#34d39933;color:var(--ok)}
canvas{width:100%;display:block;border-radius:14px;background:#00000055}#gl{height:190px}#fc,#tc{height:80px;margin-top:8px}
#sb{height:110px;overflow:auto;font-size:12px;margin-top:8px;background:#0006;border-radius:12px;padding:6px}
.bl{display:flex;justify-content:space-between;font-size:13px;margin-top:10px}.bar{height:8px;border-radius:9px;background:#ffffff14;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.badge{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:700;border:1px solid}
.sr{padding:8px 0;border-top:1px solid var(--bd);font-size:13px}.sr:first-of-type{border:0}.sr span{color:var(--mu)}.sr b{display:block}
.vd{display:flex;gap:10px;margin:8px 0;font-size:14px}.vd i{font-style:normal;font-size:22px}
.ctr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.lg{background:#ffffff14;color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;flex:none}
.q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#ffffff1f;color:var(--b);font-size:11px;font-weight:700;cursor:pointer;margin:0 6px;vertical-align:middle;text-transform:none;letter-spacing:0}
#tip{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#1b1d33;border:1px solid var(--a);border-radius:14px;padding:12px 14px;z-index:9;font-size:13px;box-shadow:0 10px 40px #000a}
.cr{background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
</style></head><body><main>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1 data-e="Real Performance Index" data-a="مؤشر الأداء الحقيقي">Real Performance Index</h1><button id="lg" class="lg">EN</button></div>
<p class="mu" style="margin:0 0 14px" data-e="Spec sheets say one thing. Your phone does another. Let's measure it." data-a="ورقة المواصفات تقول شيئًا، وهاتفك يفعل شيئًا آخر. تعال نقيس الأداء الحقيقي.">Spec sheets say one thing.</p>
<section class="c"><h2><span data-e="Your device" data-a="جهازك">Your device</span><b class="q" data-h="dev">?</b></h2><div id="info" class="grid"></div></section>
<section class="c"><label class="mu sm"><span data-e="Stress test length" data-a="مدة اختبار الحرارة">Stress test length</span><b class="q" data-h="dur">?</b><select id="dur"><option value="30">30 s</option><option value="60">1 min</option><option value="120" selected>2 min</option><option value="180">3 min</option><option value="300">5 min</option></select></label>
<button id="go" class="btn" data-e="Run Real Benchmark" data-a="ابدأ الاختبار الحقيقي">Run Real Benchmark</button><p class="mu sm" style="margin:10px 0 0" data-e="Keep the screen on and unplug the charger for battery accuracy. Takes 1 to 6 minutes depending on stress length; the phone may warm up." data-a="أبقِ الشاشة مفتوحة وافصل الشاحن لدقة قياس البطارية. يستغرق من 1 إلى 6 دقائق حسب مدة اختبار الحرارة وقد يسخن الهاتف."></p></section>
<section id="run" class="c" hidden>
<div class="row"><div class="gw" id="pgw"></div><div><div id="st">Starting…</div><div id="chips" class="chips"></div></div></div>
<canvas id="gl"></canvas><div id="live" class="mu sm" style="margin-top:6px">&nbsp;</div><canvas id="fc" width="600" height="140"></canvas><div id="sb" hidden></div></section>
<section id="res" hidden></section>
<section class="c"><h2><span data-e="Real screen identification" data-a="تحديد الشاشة الحقيقية">Real screen identification</span><b class="q" data-h="dsp">?</b></h2>
<p class="mu sm" style="margin:0" data-e="Finds the panel type (AMOLED, Super AMOLED, IPS...) and judges if it looks original, used (خلع), high copy or copy, using guided visual tests and real touch measurements." data-a="يحدد نوع الشاشة (AMOLED أو Super AMOLED أو IPS...) ويحكم هل تبدو أصلية أو خلع أو هاي كوبي أو كوبي، باختبارات بصرية موجّهة وقياسات لمس حقيقية."></p>
<button id="dgo" class="btn" data-e="Start screen lab" data-a="ابدأ فحص الشاشة">Start screen lab</button><div id="dres"></div></section>
<p class="sm" style="text-align:center;margin:6px 0"><span class="mu" data-e="Idea &amp; implementation:" data-a="الفكرة والتنفيذ:"></span> <b class="cr" data-e="Eng. Ahmed Ashour" data-a="م. أحمد عاشور"></b></p>
<p class="mu sm" style="text-align:center" data-e="Scores are heuristic and relative. Battery saver, background tabs and browser limits can lower results." data-a="النتائج تقديرية ونسبية. وضع توفير الطاقة والتبويبات الخلفية وقيود المتصفح قد تخفضها."></p><div id="tip" hidden></div>
</main>
<script>
const $=s=>document.querySelector(s),clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)),sleep=ms=>new Promise(r=>setTimeout(r,ms)),raf=()=>new Promise(r=>requestAnimationFrame(r));
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const M=v=>v>=1e9?(v/1e9).toFixed(2)+'G':v>=1e6?(v/1e6).toFixed(1)+'M':(v/1e3).toFixed(0)+'K';
const col=v=>v>=70?'var(--ok)':v>=45?'var(--wn)':'var(--bad)';
const cores=navigator.hardwareConcurrency||4,dpr=Math.min(devicePixelRatio||1,3);let hz=60,G;const TOT={cpu:0,gp:0,fr:0};
const gs=id=>`<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="gt"/><circle id="${id}" cx="60" cy="60" r="54" class="gf" transform="rotate(-90 60 60)"/></svg>`;
const gauge=(s,p)=>{$(s).style.strokeDashoffset=339.3*(1-clamp(p)/100)};
$('#pgw').innerHTML=gs('pg')+'<b id="pp">0%</b>';

/* ---------- device info ---------- */
async function detectHz(){const d=[];let l=await raf();for(let i=0;i<50;i++){const n=await raf();d.push(n-l);l=n}d.sort((a,b)=>a-b);const raw=1000/d[d.length>>1];hz=[48,60,72,90,120,144,165].reduce((p,c)=>Math.abs(c-raw)<Math.abs(p-raw)?c:p)}
function renderInfo(){const dm=navigator.deviceMemory,gl=document.createElement('canvas').getContext('webgl');let g='WebGL unavailable';
 if(gl){const e=gl.getExtension('WEBGL_debug_renderer_info');g=e?gl.getParameter(e.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)}
 const it=[['CPU cores',cores+' logical'],['Memory',dm?(dm>=8?'8+ GB':dm+' GB')+' (reported)':'Not exposed'],['Screen',screen.width+'×'+screen.height],['Pixel density',(devicePixelRatio||1).toFixed(2)+'×'],['Refresh rate',hz+' Hz'],['Platform',(navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||'n/a'],['GPU',g]];
 $('#info').innerHTML=it.map(([k,v])=>`<div class="k${k=='GPU'?' wide':''}"><b>${k}</b><span>${E(v)}</span></div>`).join('')+`<div class="k wide"><b>User agent</b><span>${E(navigator.userAgent)}</span></div>`}


/* ---------- progress + charts ---------- */
const NM=['CPU','GPU','AI','Stress','UI'],WT=[.1,.16,.08,.56,.1];
function prog(i,f=0){let p=0;for(let k=0;k<i;k++)p+=WT[k];p+=WT[i]*clamp(f,0,1);gauge('#pg',p*100);$('#pp').textContent=Math.round(p*100)+'%'}
function stage(i,t){$('#st').textContent=SG()[i];$('#chips').innerHTML=NM.map((n,k)=>`<span class="ch ${k<i?'d':k==i?'a':''}">${n}</span>`).join('');prog(i,0)}
function plot(id,a,m,c,ref){const cv=$(id),x=cv.getContext('2d'),w=cv.width,h=cv.height;x.clearRect(0,0,w,h);
 if(ref){x.setLineDash([6,6]);x.strokeStyle='#ffffff44';x.lineWidth=2;x.beginPath();const y=h-ref/m*h;x.moveTo(0,y);x.lineTo(w,y);x.stroke();x.setLineDash([])}
 if(a.length<2)return;x.strokeStyle=c;x.lineWidth=3;x.lineJoin='round';x.beginPath();a.forEach((v,i)=>{const X=i/(a.length-1)*w,Y=h-clamp(v/m,0,1)*(h-6)-3;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}
const fh=[];let lc=0;
function live(f,txt){fh.push(f);if(fh.length>150)fh.shift();if(++lc%4)return;plot('#fc',fh,hz*1.15,'#22d3ee',hz);$('#live').textContent=txt}

/* ---------- 1. CPU (Web Workers) ---------- */
function sieve(n){const s=new Uint8Array(n+1);let c=0;for(let i=2;i<=n;i++){if(!s[i]){c++;for(let j=i*i;j<=n;j+=i)s[j]=1}}return c}
function fib(n){return n<2?n:fib(n-1)+fib(n-2)}
function srt(n){const a=new Float64Array(n);let x=1;for(let i=0;i<n;i++){x=(x*16807)%2147483647;a[i]=x}a.sort();return a[n>>1]}
function work(){sieve(1500000);fib(27);srt(120000)}
const OPS=7.1e6,WSRC=[sieve,fib,srt,work].map(f=>f+'').join('\n')+'\nonmessage=()=>{const t=performance.now();work();postMessage(performance.now()-t)}';
let WU;const mk=()=>{try{WU=WU||URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'}));return new Worker(WU)}catch(e){return null}};
const runMain=()=>{TOT.cpu+=OPS;const t=performance.now();work();return performance.now()-t};
const job=w=>new Promise(res=>{if(!w)return res(runMain());w.onmessage=e=>{TOT.cpu+=OPS;res(e.data)};w.onerror=()=>res(runMain());w.postMessage(0)});
async function cpuTest(){
 const w=mk();await job(w);const s=[];for(let i=0;i<4;i++){s.push(await job(w));prog(0,(i+1)/8)}w&&w.terminate();
 const single=Math.min(...s),n=Math.min(cores,8),ws=Array.from({length:n},()=>mk());
 await Promise.all(ws.map(job));prog(0,.7);
 const t=performance.now();await Promise.all(ws.map(job));const mt=performance.now()-t;
 const fb=ws.some(x=>!x);ws.forEach(x=>x&&x.terminate());prog(0,1);
 const so=OPS/single,mo=n*OPS/mt;
 return{single,mt,n,fb,so,mo,scale:n*single/mt,score:clamp(.45*so/700+.55*mo/2800)}}

/* ---------- 2. GPU (WebGL particle mesh) ---------- */
function initGL(cv){
 const gl=cv.getContext('webgl',{antialias:false,powerPreference:'high-performance'});if(!gl)return null;
 const vs=`attribute vec3 p;uniform float t,r,d;varying float v;void main(){vec3 q=p;q.y+=sin(q.x*5.+t)*.12+cos(q.z*4.-t*1.3)*.1;float a=t*.4,c=cos(a),s=sin(a);q=vec3(c*q.x+s*q.z,q.y,-s*q.x+c*q.z);a=t*.2;c=cos(a);s=sin(a);q=vec3(q.x,c*q.y-s*q.z,s*q.y+c*q.z);v=.5+.5*q.y;gl_Position=vec4(q.x*r,q.y,q.z*.3,1.+q.z*.35);gl_PointSize=(2.2-q.z)*d;}`;
 const fs=`precision mediump float;varying float v;void main(){vec2 c=gl_PointCoord-.5;float d=dot(c,c);if(d>.25)discard;gl_FragColor=vec4(mix(vec3(.45,.3,1.),vec3(.13,.83,.93),v),.6-d);}`;
 const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o},P=gl.createProgram();
 gl.attachShader(P,sh(gl.VERTEX_SHADER,vs));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(P);if(!gl.getProgramParameter(P,gl.LINK_STATUS))return null;
 const MAX=400000,A=new Float32Array(MAX*3);for(let i=0;i<MAX;i++){const x=Math.random()*2-1,y=Math.random()*2-1,z=Math.random()*2-1,k=(.55+.4*Math.random())/(Math.hypot(x,y,z)||1);A[3*i]=x*k;A[3*i+1]=y*k;A[3*i+2]=z*k}
 gl.useProgram(P);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,A,gl.STATIC_DRAW);
 const l=gl.getAttribLocation(P,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,3,gl.FLOAT,false,0,0);
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.viewport(0,0,cv.width,cv.height);
 const ut=gl.getUniformLocation(P,'t'),ur=gl.getUniformLocation(P,'r'),ud=gl.getUniformLocation(P,'d');
 gl.uniform1f(ur,cv.height/cv.width);gl.uniform1f(ud,dpr*1.6);
 return{gl:1,max:MAX,draw(n,t){TOT.gp+=n;TOT.fr++;gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(ut,t);gl.drawArrays(gl.POINTS,0,n)}}}
function init2D(cv){const x=cv.getContext('2d');return{gl:0,max:60000,draw(n,t){TOT.gp+=n;TOT.fr++;x.fillStyle='#07080f';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#7c5cffaa';const m=Math.min(n/40,1500);for(let i=0;i<m;i++){const a=i*2.399+t,r=Math.sqrt(i/m)*cv.height*.45;x.fillRect(cv.width/2+Math.cos(a)*r,cv.height/2+Math.sin(a)*r*Math.cos(t*.5+i),3,3)}}}}
async function gpuTest(dur){
 const tg=hz,MAXN=G.max;let n=25000,best=n,last=await raf(),win=[],ramp=true;const t0=last,fr=[];let step=t0;
 for(;;){const now=await raf(),dt=now-last;last=now;const el=now-t0;if(el>dur)break;
  G.draw(n,el/1000);win.push(dt);
  if(el>dur-3000){if(ramp){ramp=false;n=best}fr.push(dt)}
  if(ramp&&now-step>420){const f=1000*win.length/win.reduce((a,b)=>a+b);win=[];step=now;
   if(f>=tg*.85){best=n;if(n>=MAXN)ramp=false;else n=Math.min(MAXN,Math.round(n*1.3))}else{n=best;ramp=false}}
  live(1000/dt,`${(n/1000).toFixed(0)}k particles · ${(1000/dt).toFixed(0)} fps`);if(lc%15==0)prog(1,el/dur)}
 const sum=fr.reduce((a,b)=>a+b,0)||1,fps=1000*fr.length/sum,drop=fr.filter(d=>d>1500/tg).length/(fr.length||1)*100;
 const load=clamp(100*Math.log(best/15000)/Math.log(MAXN/15000));
 return{best,fps,drop,gl:G.gl,score:clamp(.5*load+.35*clamp(fps/tg*100)+.15*(100-clamp(drop*2)))}}

/* ---------- 3. AI / matrix ---------- */
async function aiTest(dur=4000){
 const N=192,B=48,rn=n=>{const a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=Math.random()-.5;return a};
 const W=[rn(N*N),rn(N*N),rn(N*N)],X=rn(B*N),H=[0,1,2].map(()=>new Float32Array(B*N));
 const mm=(a,b,c)=>{c.fill(0);for(let i=0;i<B;i++){const ro=i*N;for(let k=0;k<N;k++){const v=a[ro+k],bo=k*N;for(let j=0;j<N;j++)c[ro+j]+=v*b[bo+j]}}};
 const act=c=>{for(let i=0;i<c.length;i++){const v=c[i]*.1;c[i]=v>0?v:v*.01}};
 let inf=0,tm=0,mx=0;const t0=performance.now();let ys=t0;
 while(performance.now()-t0<dur){const s=performance.now();let a=X;for(let l=0;l<3;l++){mm(a,W[l],H[l]);act(H[l]);a=H[l]}
  const d=performance.now()-s;tm+=d;mx=Math.max(mx,d);inf++;
  if(performance.now()-ys>14){ys=performance.now();prog(2,(ys-t0)/dur);$('#live').textContent=`${inf} inference passes…`;await sleep(0)}}
 const gf=inf*3*2*B*N*N/tm/1e6;return{inf,gf,lat:tm/inf,mx,mob:600/gf,score:clamp(gf/3*100)}}

/* ---------- 4. Thermal / sustained stress ---------- */
function ratio(S){const b=S.slice(S.length>5?1:0,6),m=k=>b.reduce((a,x)=>a+x[k],0)/b.length,bf=m('f'),bo=m('o');return S.map(x=>bo>0?50*x.f/bf+50*x.o/bo:100*x.f/bf)}
async function stress(dur,n){
 const nW=Math.max(1,Math.min(cores-1,6)),ws=Array.from({length:nW},()=>mk()).filter(Boolean);let ops=0,go=true;
 ws.forEach(async w=>{while(go){await job(w);ops+=OPS;await sleep(0)}});
 fh.length=0;const S=[];let t0=await raf(),ss=t0,fr=0,lo=0;
 for(;;){const now=await raf(),el=now-t0;if(el>=dur)break;G.draw(n,el/1000);fr++;
  if(now-ss>=1000){const s=(now-ss)/1000;S.push({f:fr/s,o:(ops-lo)/s});fr=0;lo=ops;ss=now;
   const r=ratio(S);plot('#fc',r,120,'#fbbf24',100);prog(3,el/dur);
   $('#live').textContent=`Sustained load ${Math.round(el/1000)}/${dur/1000}s · ${S[S.length-1].f.toFixed(0)} fps · performance retained ${Math.min(r[r.length-1],999).toFixed(0)}%`}}
 go=false;ws.forEach(w=>w.terminate());return{S,workers:ws.length}}

/* ---------- 5. UI smoothness & memory ---------- */
async function uiTest(){
 let dom=1e9;const host=document.createElement('div');host.style.cssText='position:absolute;left:-9999px;top:0;width:300px';document.body.appendChild(host);
 for(let r=0;r<3;r++){const t=performance.now(),f=document.createDocumentFragment();
  for(let i=0;i<3000;i++){const d=document.createElement('div');d.textContent='row '+i;d.style.padding=(i%5)+'px';f.appendChild(d)}
  host.appendChild(f);let h=0;for(let i=0;i<300;i++){host.children[i].style.fontSize=(10+i%6)+'px';h+=host.offsetHeight}
  host.textContent='';dom=Math.min(dom,performance.now()-t);await sleep(0)}
 host.remove();prog(4,.3);
 const sb=$('#sb');sb.hidden=false;if(!sb.children.length)sb.innerHTML=Array.from({length:600},(_,i)=>`<div>Row ${i} · scroll latency probe</div>`).join('');
 const mxS=sb.scrollHeight-sb.clientHeight,fr=[];let last=await raf();const t0=last;
 for(;;){const now=await raf(),el=now-t0;if(el>2500)break;fr.push(now-last);last=now;sb.scrollTop=mxS*el/2500}
 sb.hidden=true;prog(4,.8);
 const avg=fr.reduce((a,b)=>a+b,0)/fr.length,jit=Math.sqrt(fr.reduce((a,b)=>a+(b-avg)**2,0)/fr.length),drop=fr.filter(d=>d>1500/hz).length/fr.length*100;
 let mbs=0;try{const t=performance.now();let a=[];for(let i=0;i<8;i++){const x=new Float64Array(5e5);x.fill(i+1);a.push(x)}mbs=32/((performance.now()-t)/1000);a=null}catch(e){}
 const hl=performance.memory?performance.memory.jsHeapSizeLimit/1048576:0;
 const domS=clamp(6000/dom),smooth=clamp(100-drop*1.5-jit*2),memS=mbs?clamp(mbs/2000*100):50;
 return{dom,avg,jit,drop,mbs,hl,score:.35*domS+.45*smooth+.2*memS}}

/* ---------- orchestration ---------- */
async function run(){
